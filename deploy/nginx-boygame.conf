# Конфиг nginx для «Игры для детей».
# 1) Замените YOUR_DOMAIN на свой домен (в двух местах ниже).
# 2) Скопируйте в /etc/nginx/sites-available/boygame и включите симлинком.
# 3) После установки certbot этот файл будет дополнен HTTPS-блоком автоматически.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/boygame;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # Service worker нельзя кэшировать надолго — иначе обновления «залипают».
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Главную тоже отдаём без кэша (service worker сам кэширует при необходимости).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Правильный MIME-тип для веб-манифеста.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Всё остальное (css/js/icons) — обычная отдача файлов.
    location / {
        try_files $uri $uri/ =404;
    }
}
