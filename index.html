<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7b5cff" />
  <meta name="description" content="Простые развивающие игры для детей: память, логика, последовательности и счёт." />
  <title>Игры для детей</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Игры" />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/games/learning.css" />
  <link rel="stylesheet" href="css/app-ui.css" />
  <link rel="stylesheet" href="css/games/arcade.css" />
  <link rel="stylesheet" href="css/games/board.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="homeBtn" class="icon-btn hidden" type="button" aria-label="home">🏠</button>
      <h1 id="title">Игры</h1>
      <span class="grow"></span>
      <button id="musicBtn" class="icon-btn" type="button" aria-label="music" aria-pressed="true">🎵</button>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="sound">🔊</button>
      <button id="langBtn" class="icon-btn lang-btn" type="button" aria-label="language">RU</button>
    </header>
    <main id="screen" class="screen"></main>
  </div>

  <div id="overlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <section id="startupSplash" class="startup-splash" aria-label="Заставка игры">
    <div class="splash-orbit splash-orbit-one" aria-hidden="true">🧩</div>
    <div class="splash-orbit splash-orbit-two" aria-hidden="true">🔢</div>
    <div class="splash-orbit splash-orbit-three" aria-hidden="true">🐉</div>
    <span class="splash-spark splash-spark-one" aria-hidden="true">✦</span>
    <span class="splash-spark splash-spark-two" aria-hidden="true">★</span>
    <span class="splash-spark splash-spark-three" aria-hidden="true">✦</span>
    <span class="splash-spark splash-spark-four" aria-hidden="true">★</span>
    <div class="splash-mascot" aria-hidden="true">🦁</div>
    <h2 class="splash-title" data-splash-title>Игры</h2>
    <p class="splash-subtitle" data-splash-subtitle>Учимся, играя!</p>
    <div class="splash-loader" aria-hidden="true"><span></span></div>
    <button id="skipSplashBtn" class="splash-skip" type="button">Пропустить</button>
  </section>

  <script src="js/release.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ages.js"></script>
  <script src="js/task-history.js"></script>
  <script src="js/usage-store.js"></script>
  <script src="js/store.js"></script>
  <script src="js/analytics-config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/adaptive.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/game-catalog.js"></script>
  <script src="js/game-session.js"></script>
  <script src="js/game-loader.js"></script>
  <script src="js/play-time.js"></script>
  <script src="js/app.js"></script>
  <script src="js/app/profiles.js"></script>
  <script src="js/app/home.js"></script>
  <script src="js/app/parents.js"></script>
  <script src="js/app/privacy.js"></script>
  <script src="js/app/admin.js"></script>
  <script src="js/app/rewards.js"></script>
  <script src="js/app/dialogs.js"></script>
  <script src="js/app/play-time.js"></script>
  <!-- games:start (modules loaded on demand from GameCatalog) -->
  <!-- games:end -->
  <script src="js/main.js"></script>
</body>
</html>
